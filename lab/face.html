<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>THE_LAB · Face</title>
<style>
  :root{--bg:#1b1a18;--panel:#2c2a27;--ink:#eee;--dim:#a49c8c;--gold:#d8b25a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden}
  canvas{display:block;touch-action:none}
  #bar{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;pointer-events:none}
  #bar>*{pointer-events:auto}
  .chip{background:var(--panel);border:0;color:var(--ink);padding:8px 12px;border-radius:999px;font:inherit;cursor:pointer}
  .chip.on{background:var(--gold);color:#1b1a18}
  a.chip{text-decoration:none}
  #panel{position:fixed;right:10px;top:60px;bottom:10px;width:320px;background:rgba(44,42,39,.94);border-radius:12px;padding:10px 12px;overflow:auto}
  @media (max-width:700px){#panel{left:10px;right:10px;width:auto;top:auto;height:46vh}}
  h4{margin:10px 0 2px;color:var(--gold);font-weight:600}
  .ex{display:grid;grid-template-columns:1fr 110px 36px;gap:6px;align-items:center;margin:3px 0;font-size:12px}
  .ex input[type=range]{width:100%;height:24px}
  .ex span{color:var(--dim);text-align:right}
  .ex.missing{opacity:.35}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  #msg{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.4}
  #mood{display:grid;grid-template-columns:70px 1fr 36px;gap:6px;align-items:center;font-size:12px}
</style></head><body>
<div id="bar">
  <a class="chip" href="../">← Lab</a>
  <select id="bodySel" class="chip"></select>
  <button class="chip on" id="live" title="Mood face, blinks, gaze">Living face</button>
  <button class="chip" id="talk" title="Amplitude-driven mouth from your mic">Mic → mouth</button>
</div>
<div id="panel">
  <div id="status">loading…</div>
  <h4>Mood (what the mind sends)</h4>
  <div id="mood">
    <span>valence</span><input id="val" type="range" min="-1" max="1" step="0.01" value="0"><span id="valV">0</span>
    <span>energy</span><input id="eng" type="range" min="0" max="1" step="0.01" value="0.5"><span id="engV">.5</span>
  </div>
  <div class="row">
    <button class="chip" data-ex="mouthSmile_L,mouthSmile_R">smile</button>
    <button class="chip" data-ex="browInnerUp_L,browInnerUp_R">worry</button>
    <button class="chip" data-ex="eyeWide_L,eyeWide_R,browOuterUp_L,browOuterUp_R">surprise</button>
    <button class="chip" data-ex="browDown_L,browDown_R,noseSneer_L,noseSneer_R">annoyed</button>
    <button class="chip" id="zero">all zero</button>
  </div>
  <h4>Expressions (the contract)</h4>
  <div id="exs"></div>
  <div id="msg">Sliders write morph-target weights directly, by contract id. Grey rows are ids this GLB does not carry yet (run <code>tools/face/fit-facekit.py</code> on it). Drag to orbit, wheel/pinch to zoom.</div>
</div>
<script type="module">
import * as THREE from '../assets/vendor/three/three.module.js';
import { GLTFLoader } from '../assets/vendor/three/three.addons.js';
import { loadContract, FaceRig } from '../world/face.mjs';

const q = new URLSearchParams(location.search);
const isPhone = matchMedia('(max-width:700px)').matches;
const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.setSize(innerWidth, innerHeight);
document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x24221f);
scene.add(new THREE.HemisphereLight(0xfff3e0, 0x3a3530, 1.2));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(0.6, 2.2, 1.4); scene.add(key);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50);
const orbit = { yaw: 0, pitch: 0.05, dist: 0.75, target: new THREE.Vector3(0, 1.58, 0) };
function placeCam() { cam.position.set(orbit.target.x + Math.sin(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist, orbit.target.y + Math.sin(orbit.pitch) * orbit.dist, orbit.target.z + Math.cos(orbit.yaw) * Math.cos(orbit.pitch) * orbit.dist); cam.lookAt(orbit.target); }
let drag = null;
r.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (!drag) return; orbit.yaw -= (e.clientX - drag.x) * 0.006; orbit.pitch = Math.max(-1.2, Math.min(1.2, orbit.pitch + (e.clientY - drag.y) * 0.006)); drag = { x: e.clientX, y: e.clientY }; });
r.domElement.addEventListener('wheel', (e) => { orbit.dist = Math.max(0.25, Math.min(3, orbit.dist * (1 + e.deltaY * 0.001))); }, { passive: true });
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); r.setSize(innerWidth, innerHeight); });

const contract = await loadContract();
const bodies = ['dante', 'adult-base-01', 'adult-base-02', 'cole', 'rodin', 'tariq', 'tommy'];
const sel = document.getElementById('bodySel');
for (const b of bodies) sel.append(new Option(b, b));
sel.value = q.get('body') || 'dante';

let model = null, face = null;
async function load(name) {
  if (model) scene.remove(model);
  face = null;
  // a fitted file (<tier>.face.glb) wins over the plain body, so you can compare before replacing anything
  const tier = isPhone ? 'mobile' : 'desktop';
  const tries = [`../assets/bodies/${name}/${tier}.face.glb`, `../assets/bodies/${name}/${tier}.glb`];
  const loader = new GLTFLoader();
  let gltf = null, used = null;
  for (const u of tries) { try { gltf = await loader.loadAsync(u); used = u; break; } catch { /* next */ } }
  if (!gltf) { status(`could not load ${name}`); return; }
  model = gltf.scene; scene.add(model);
  face = new FaceRig(model, contract, { smoothing: 10 });
  status(`${used.split('/').pop()} · ${face.rigged ? `face tier: ${face.tier} (${face.index.size}/${contract.expressions.length} ids)` : 'no face rig on this GLB'}`);
  buildSliders();
}
function status(t) { document.getElementById('status').textContent = t; }

const exs = document.getElementById('exs');
const sliders = {};
function buildSliders() {
  exs.innerHTML = '';
  for (const group in contract.groups) {
    const h = document.createElement('h4'); h.textContent = group; exs.append(h);
    for (const id of contract.groups[group]) {
      const row = document.createElement('div'); row.className = 'ex' + (face.index.has(id) ? '' : ' missing');
      const lab = document.createElement('span'); lab.style.textAlign = 'left'; lab.textContent = id;
      const inp = document.createElement('input'); inp.type = 'range'; inp.min = 0; inp.max = 1; inp.step = 0.01; inp.value = 0;
      const v = document.createElement('span'); v.textContent = '0';
      inp.oninput = () => { manual[id] = +inp.value; v.textContent = (+inp.value).toFixed(2); };
      row.append(lab, inp, v); exs.append(row); sliders[id] = { inp, v };
    }
  }
}
const manual = {};
document.getElementById('zero').onclick = () => { for (const id in manual) { manual[id] = 0; sliders[id].inp.value = 0; sliders[id].v.textContent = '0'; } };
for (const b of document.querySelectorAll('[data-ex]')) b.onclick = () => { if (face) for (const id of b.dataset.ex.split(',')) face.express(id, 0.9, 1.5); };

const live = document.getElementById('live'); live.onclick = () => live.classList.toggle('on');
const val = document.getElementById('val'), eng = document.getElementById('eng');
function moodChanged() { document.getElementById('valV').textContent = (+val.value).toFixed(2); document.getElementById('engV').textContent = (+eng.value).toFixed(2); if (face) face.setMood({ valence: +val.value, energy: +eng.value }); }
val.oninput = eng.oninput = moodChanged;

const talk = document.getElementById('talk');
talk.onclick = async () => {
  if (talk.classList.contains('on')) { face?.stopSpeaking(); talk.classList.remove('on'); return; }
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ac = new AudioContext(); const an = ac.createAnalyser(); an.fftSize = 256; ac.createMediaStreamSource(stream).connect(an);
  face?.speakAmplitude(an); talk.classList.add('on');
};

sel.onchange = () => load(sel.value);
await load(sel.value);

const clock = new THREE.Clock();
function frame() {
  const dt = clock.getDelta();
  if (face) {
    if (live.classList.contains('on')) {
      // idle gaze wander so the eyes show
      const t = clock.elapsedTime; face.setGaze(Math.sin(t * 0.37) * 0.25, Math.sin(t * 0.21) * 0.12);
      face.update(dt);
    }
    for (const id in manual) { // manual sliders sit on top of whatever the rig did
      if (manual[id] <= 0) continue;
      for (const s of face.index.get(id) || []) s.mesh.morphTargetInfluences[s.i] = Math.max(s.mesh.morphTargetInfluences[s.i], manual[id]);
    }
  }
  placeCam(); r.render(scene, cam); requestAnimationFrame(frame);
}
frame();
window.__face = { get face() { return face; }, contract };
</script></body></html>
