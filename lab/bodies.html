<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>THE_LAB · Bodies</title>
<style>
  :root{--bg:#1b1a18;--panel:#2c2a27;--ink:#eee;--dim:#a49c8c;--gold:#d8b25a}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block}
  #bar{position:fixed;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;pointer-events:none}
  #bar>*{pointer-events:auto}
  .chip{background:var(--panel);border:0;color:var(--ink);padding:9px 14px;border-radius:999px;font:inherit;cursor:pointer}
  .chip.on{background:var(--gold);color:#1b1a18}
  a.chip{text-decoration:none}
  #info{position:fixed;left:12px;bottom:12px;right:12px;max-width:520px;background:var(--panel);border-radius:12px;padding:10px 14px;color:var(--dim);line-height:1.45}
  #info b{color:var(--ink)}
</style></head><body>
<div id="bar">
  <a class="chip" href="../">← Lab</a>
  <select id="pick" class="chip"></select>
  <button class="chip" data-q="desktop">Desktop</button>
  <button class="chip" data-q="mobile">Mobile</button>
  <button class="chip" id="ruler">Ruler</button>
  <button class="chip" id="pose">Pose test</button>
  <button class="chip" id="motion">Motion</button>
  <select class="chip" id="anim"><option value="">Animation: none</option></select>
  <button class="chip" id="anat" hidden>Anatomy</button>
  <button class="chip on" id="phys" hidden>Physics</button>
  <select class="chip" id="preset" hidden><option value="">Anatomy: lab baseline</option></select>
</div>
<div id="info">Loading…</div>
<script type="module">
import * as THREE from '../assets/vendor/three/three.module.js';
import { GLTFLoader } from '../assets/vendor/three/three.addons.js';
import { attachAnatomy } from '../world/attach-anatomy.mjs';
import { captureRest, retargetClip, clipLabel } from '../world/retarget.mjs';

const isPhone = matchMedia('(pointer:coarse)').matches || innerWidth < 800;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 2 : 1.5));
r.setSize(innerWidth, innerHeight);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.shadowMap.enabled = true;
document.body.prepend(r.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x24221f);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x3a3530, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(2.5, 4, 3); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.5, right: 1.5, top: 2.5, bottom: -0.5 });
scene.add(key);
const rim = new THREE.DirectionalLight(0xbcd0ff, 0.8); rim.position.set(-3, 2.5, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: 0x3a3631, roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

// height ruler: 10 cm ticks, labelled every 50 cm
const ruler = new THREE.Group(); ruler.visible = false; scene.add(ruler);
{ const m = new THREE.LineBasicMaterial({ color: 0xd8b25a });
  const pts = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 2, 0)];
  for (let i = 0; i <= 20; i++) { const w = i % 5 ? 0.03 : 0.08; pts.push(new THREE.Vector3(0, i / 10, 0), new THREE.Vector3(w, i / 10, 0)); }
  const g = new THREE.BufferGeometry().setFromPoints(pts);
  const l = new THREE.LineSegments(g, m); ruler.add(l); ruler.position.set(-1.05, 0, 0); }

const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 50);
let yaw = 0.35, pitch = 0.08, dist = isPhone ? 6.2 : 5.0, target = new THREE.Vector3(0, 0.95, 0);
function place() {
  cam.position.set(target.x + dist * Math.sin(yaw) * Math.cos(pitch), target.y + dist * Math.sin(pitch), target.z + dist * Math.cos(yaw) * Math.cos(pitch));
  cam.lookAt(target);
}
// drag to orbit, two-finger pinch / wheel to zoom, vertical drag with 2 fingers pans height
const ptrs = new Map(); let lastPinch = 0, lastMidY = 0;
addEventListener('pointerdown', e => { if (e.target.closest('#bar,#info')) return; ptrs.set(e.pointerId, e); });
addEventListener('pointerup', e => ptrs.delete(e.pointerId));
addEventListener('pointercancel', e => ptrs.delete(e.pointerId));
addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  const p = ptrs.get(e.pointerId);
  if (ptrs.size === 1) {
    yaw -= (e.clientX - p.clientX) * 0.008;
    pitch = THREE.MathUtils.clamp(pitch + (e.clientY - p.clientY) * 0.005, -0.4, 1.2);
  }
  ptrs.set(e.pointerId, e);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), my = (a.clientY + b.clientY) / 2;
    if (lastPinch) { dist = THREE.MathUtils.clamp(dist * lastPinch / d, 0.6, 10); target.y = THREE.MathUtils.clamp(target.y + (my - lastMidY) * 0.003, 0.1, 1.9); }
    lastPinch = d; lastMidY = my;
  } else lastPinch = 0;
});
addEventListener('wheel', e => { dist = THREE.MathUtils.clamp(dist * (1 + e.deltaY * 0.001), 0.6, 10); }, { passive: true });
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

const info = document.getElementById('info'), pick = document.getElementById('pick');
const loader = new GLTFLoader();
const list = await (await fetch('../assets/bodies/bodies.json')).json();
for (const b of list) pick.add(new Option(b.name, b.id));
let quality = isPhone ? 'mobile' : 'desktop', current = null, anat = null, anatOn = true;
// animation library: clips on a source skeleton, retargeted onto whichever body is shown
const animSel = document.getElementById('anim');
let packRest = null, packClips = [], mixer = null, bodyRest = null;
loader.loadAsync('../assets/anims/meshy-pack-01.glb').then(g => {
  packRest = captureRest(g.scene, { allNodes: true }); packClips = g.animations;
  packClips.forEach((c, i) => animSel.add(new Option('Animation: ' + clipLabel(c.name), i)));
}).catch(e => console.warn('animation pack', e));
function stopAnim() {
  if (!mixer) return;
  mixer.stopAllAction();
  if (bodyRest) for (const r of Object.values(bodyRest)) { r.bone.quaternion.copy(r.q); r.bone.position.copy(r.p); }
  animSel.value = '';
}
animSel.onchange = () => {
  const i = animSel.value; stopMotion(); if (posed) document.getElementById('pose').click();
  if (mixer) mixer.stopAllAction();
  if (bodyRest) for (const r of Object.values(bodyRest)) { r.bone.quaternion.copy(r.q); r.bone.position.copy(r.p); }
  if (i === '' || !current || !packRest) return;
  const clip = retargetClip(packClips[+i], packRest, bodyRest);
  mixer.clipAction(clip).reset().play();
  anat?.sim.reset();
};
const anatBtn = document.getElementById('anat'), presetSel = document.getElementById('preset'), physBtn = document.getElementById('phys');
physBtn.onclick = () => { if (!anat) return; anat.setPhysics(!anat.physics); physBtn.classList.toggle('on', anat.physics); };
// presets saved by the Measure tool / the anatomy lab (this browser only)
function readPresets() { try { return JSON.parse(localStorage.getItem('dev_overlay_presets_v1') || '{}') || {}; } catch (_) { return {}; } }
function fillPresets() {
  const all = readPresets(), keep = presetSel.value;
  presetSel.length = 1;
  for (const k of Object.keys(all).sort()) presetSel.add(new Option('Anatomy: ' + k, k));
  presetSel.value = all[keep] ? keep : '';
}
presetSel.onfocus = fillPresets;
presetSel.onchange = () => { if (anat) anat.rebuild(readPresets()[presetSel.value] || {}); };
anatBtn.onclick = () => { anatOn = !anatOn; anat?.setVisible(anatOn); anatBtn.classList.toggle('on', anatOn); };

async function show() {
  posed = false; document.getElementById('pose')?.classList.remove('on');
  stopMotion();
  const b = list.find(x => x.id === pick.value);
  document.querySelectorAll('[data-q]').forEach(el => el.classList.toggle('on', el.dataset.q === quality));
  info.textContent = 'Loading…';
  const t0 = performance.now();
  const gltf = await loader.loadAsync('../assets/bodies/' + b[quality]);
  if (anat) { anat.dispose(); anat = null; }
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose(); }); }
  current = gltf.scene;
  current.updateMatrixWorld(true);
  current.traverse(o => { if (o.isBone) restFrame(o); });   // each bone's rest frame, before anything poses it
  bodyRest = captureRest(current); mixer = new THREE.AnimationMixer(current); animSel.value = '';
  if (b.anatomy) {
    fillPresets();
    anat = attachAnatomy(current, b.anatomy, readPresets()[presetSel.value] || {});
    anat.setVisible(anatOn);
  }
  anatBtn.hidden = presetSel.hidden = physBtn.hidden = !b.anatomy; physBtn.classList.add('on'); anatBtn.classList.toggle('on', anatOn);
  let tris = 0;
  current.traverse(o => { if (o.isMesh) { o.castShadow = true; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } });
  scene.add(current);
  const box = new THREE.Box3().setFromObject(current), h = box.max.y - box.min.y;
  const ft = h / 0.3048, inch = Math.round((ft % 1) * 12);
  info.innerHTML = `<b>${b.name}</b> · ${quality}<br>${(h * 100).toFixed(0)} cm (${Math.floor(ft)}′${inch}″) · ${Math.round(tris).toLocaleString()} triangles · ${b.rigged ? 'rigged' : 'not rigged'} · loaded in ${((performance.now() - t0) / 1000).toFixed(1)} s<br>${b.notes || ''}`;
}
pick.onchange = show;
document.querySelectorAll('[data-q]').forEach(el => el.onclick = () => { quality = el.dataset.q; show(); });
// motion test: a jog in place for 3 s, then 2 s standing still - the
// anatomy's lag, swing and settle show in the stop
const MOVE_BONES = ['Hips', 'LeftUpLeg', 'RightUpLeg', 'LeftLeg', 'RightLeg', 'Spine01', 'LeftArm', 'RightArm', 'LeftForeArm', 'RightForeArm'];
let mot = null;
function stopMotion() {
  if (!mot) return;
  mot.bones.forEach((b, i) => { if (b) b.quaternion.copy(mot.q[i]); });
  if (mot.hips) mot.hips.position.copy(mot.p0);
  mot = null; document.getElementById('motion').classList.remove('on');
}
function startMotion() {
  if (!current) return;
  stopAnim();
  if (posed) document.getElementById('pose').click();
  const bones = MOVE_BONES.map(n => current.getObjectByName(n)), hips = bones[0];
  const par = hips.parent, w0 = hips.getWorldPosition(new THREE.Vector3());
  const up = par.worldToLocal(w0.clone().add(new THREE.Vector3(0, 1, 0))).sub(par.worldToLocal(w0.clone()));   // one metre up, in the hips' parent's units
  mot = { bones, q: bones.map(b => b?.quaternion.clone()), hips, p0: hips.position.clone(), up, t: 0 };
  document.getElementById('motion').classList.add('on');
}
const _mq = new THREE.Quaternion(), _e = new THREE.Euler();
// rotate a bone by an Euler given in the body's rest frame (x: his left, y: up,
// z: his front), whatever axes the rig gave the bone - Mixamo and MeshyRig differ
function restFrame(b) {
  if (!b.userData.pw) { b.parent.updateWorldMatrix(true, false); b.userData.pw = b.parent.getWorldQuaternion(new THREE.Quaternion()); b.userData.pwi = b.userData.pw.clone().invert(); }
  return b.userData;
}
function setRest(b, restQ, x, y, z) {
  const u = restFrame(b);
  _mq.setFromEuler(_e.set(x, y, z));
  b.quaternion.copy(u.pwi).multiply(_mq).multiply(u.pw).multiply(restQ);
}
function motionTick(dt) {
  if (!mot) return;
  mot.t += dt;
  const T = mot.t % 5, run = T < 3 ? Math.min(1, T * 3) * Math.min(1, (3 - T) * 6) : 0;   // ease in, sharp stop
  const ph = mot.t * Math.PI * 2 * 1.4, s = Math.sin(ph), c = Math.cos(ph);
  const set = (i, x, y, z) => { const b = mot.bones[i]; if (b) setRest(b, mot.q[i], x * run, y * run, z * run); };
  set(0, 0.12, 0.10 * s, 0.06 * s);                 // hips: lean, turn, roll with the stride
  set(1, -0.75 * Math.max(0, s) + 0.25 * Math.max(0, -s), 0, 0);
  set(2, -0.75 * Math.max(0, -s) + 0.25 * Math.max(0, s), 0, 0);
  set(3, 1.1 * Math.max(0, s) + 0.2, 0, 0);
  set(4, 1.1 * Math.max(0, -s) + 0.2, 0, 0);
  set(5, -0.08, -0.12 * s, 0);
  set(6, 0.5 * s, 0, 0.4); set(7, -0.5 * s, 0, -0.4);
  set(8, 0, -0.8, 0); set(9, 0, 0.8, 0);
  mot.hips.position.copy(mot.p0).addScaledVector(mot.up, 0.045 * Math.abs(c) * run);   // the bounce, twice a stride
}
document.getElementById('motion').onclick = () => mot ? stopMotion() : startMotion();
// pose test: bend a few bones to check the rig and skin weights
let posed = false, rest = null;
document.getElementById('pose').onclick = e => {
  if (!current) return;
  const bones = ['Hips','LeftArm','RightArm','RightForeArm','LeftUpLeg','LeftLeg','Spine01','Head'];
  if (!posed) {
    stopAnim();
    rest = bones.map(n => current.getObjectByName(n)?.quaternion.clone());
    const P = { Hips: [0.35, 0, 0], Spine01: [-0.3, 0.3, 0], LeftArm: [0, 0, 0.5], RightArm: [0, 0, -0.9], RightForeArm: [0, -1.2, 0], LeftUpLeg: [-0.9, 0, 0], LeftLeg: [1.2, 0, 0], Head: [0, -0.4, 0] };
    bones.forEach((n, i) => { const o = current.getObjectByName(n); if (o && P[n]) setRest(o, rest[i], ...P[n]); });
  } else bones.forEach((n, i) => { const o = current.getObjectByName(n); if (o && rest[i]) o.quaternion.copy(rest[i]); });
  posed = !posed; e.target.classList.toggle('on', posed);
};
document.getElementById('ruler').onclick = e => { ruler.visible = !ruler.visible; e.target.classList.toggle('on', ruler.visible); };
if (list.length) await show(); else info.textContent = 'No imported bodies yet.';
// (for tests and links: set the view)
window.__view = (y, p, d, t) => { yaw = y; pitch = p; dist = d; target.y = t; };
window.__lab = { get anat() { return anat; }, get model() { return current; } };
let lastT = performance.now();
r.setAnimationLoop(now => { const dt = Math.min((now - lastT) / 1000, 0.05); lastT = now; place(); motionTick(dt); mixer?.update(dt); anat?.update(dt); r.render(scene, cam); });
</script>
</body></html>
