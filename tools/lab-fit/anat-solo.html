<!doctype html><body style="margin:0;background:#2a2a2e"><script type="module">
// The anatomy alone (the build-man path, as attach-anatomy builds it) under studio light:
// ?p=<json params>&n=<columns>  - each column a roll (seeded 1..n) about the base in p, or p as is with n=1.
// Renders front and side per column.
import * as THREE from '../../assets/vendor/three/three.module.js';
import { buildAnatomy, getAnatomy, setSoft } from '../../assets/intro3d/figure.mjs';
import { rollAnatomy } from '../../world/attach-anatomy.mjs';
const f = new URLSearchParams(location.search), base = JSON.parse(f.get('p') || '{}'), n = +(f.get('n') || 1), roll = f.get('roll') !== '0';
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.setScissorTest(true); document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x2a2a2e);
s.add(new THREE.HemisphereLight(0xfff4e6, 0x554433, 1.1)); const d = new THREE.DirectionalLight(0xffffff, 2.0); d.position.set(2, 3, -3); s.add(d); const d2 = new THREE.DirectionalLight(0xffffff, 0.7); d2.position.set(-3, 1, 2); s.add(d2);
const m = new THREE.MeshStandardMaterial({ color: new THREE.Color(f.get('tone') || '#b98670'), roughness: 0.55 });
const cam = new THREE.PerspectiveCamera(30, (W / n) / (H / 2), 0.5, 200);
for (let i = 0; i < n; i++) {
  const pouch = new THREE.Group(); pouch.userData.live = true; s.add(pouch);
  const a = roll ? rollAnatomy(base, i + 1) : Object.assign(getAnatomy(), base);
  setSoft(1); buildAnatomy(pouch, m, a); setSoft(0.8);
  pouch.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(pouch), c = box.getCenter(new THREE.Vector3()), R = box.getSize(new THREE.Vector3()).length();
  [[0, 0.1], [Math.PI / 2, 0.1]].forEach(([yaw, pitch], row) => {
    // (the lab's men face -z: front is from -z)
    cam.position.set(c.x - Math.sin(yaw) * R * 1.6, c.y + pitch * R, c.z - Math.cos(yaw) * R * 1.6); cam.lookAt(c);
    s.children.forEach(o => { if (o.isGroup) o.visible = o === pouch; });
    r.setViewport(i * W / n, (1 - row) * H / 2, W / n, H / 2); r.setScissor(i * W / n, (1 - row) * H / 2, W / n, H / 2); r.render(s, cam);
  });
}
document.title = 'done';
</script>
