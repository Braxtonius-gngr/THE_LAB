<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>THE_LAB · Apartment</title>
<style>
  :root{--panel:rgba(28,26,23,.86);--ink:#eee;--dim:#a49c8c;--gold:#d8b25a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#15130f;color:var(--ink);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
  #top>*{pointer-events:auto}
  .chip{background:var(--panel);border:0;color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
  .chip.on{background:var(--gold);color:#1b1a18}
  #status{color:var(--dim);font-size:13px;margin-left:auto;background:var(--panel);padding:6px 10px;border-radius:999px}
  #bubble{position:fixed;transform:translate(-50%,-100%);max-width:min(70vw,420px);background:#f4efe6;color:#1b1a18;padding:10px 14px;border-radius:14px;line-height:1.35;display:none;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#f4efe6;border-bottom:0}
  #chat{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #log{max-height:28vh;overflow:auto;display:flex;flex-direction:column;gap:4px;pointer-events:auto;padding-right:4px}
  .msg{background:var(--panel);padding:7px 11px;border-radius:12px;max-width:80%;line-height:1.3;backdrop-filter:blur(6px)}
  .msg.me{align-self:flex-end;background:rgba(216,178,90,.22)}
  .msg.sys{align-self:center;color:var(--dim);font-size:12px;background:transparent}
  form{display:flex;gap:6px;pointer-events:auto}
  input{flex:1;background:var(--panel);border:1px solid #3d3a35;color:var(--ink);padding:11px 14px;border-radius:999px;font:inherit;outline:none;backdrop-filter:blur(6px)}
  button.send{background:var(--gold);border:0;color:#1b1a18;padding:0 16px;border-radius:999px;font:inherit;font-weight:600}
  button.send.on{background:#d9534f;color:#fff}
  #mic{padding:0 12px}
  #pad{position:fixed;left:16px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 120px);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);display:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25)}
  @media (pointer:coarse){#pad{display:block}}
  #mem{position:fixed;top:52px;right:10px;width:min(360px,80vw);max-height:50vh;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--dim);display:none;backdrop-filter:blur(6px)}
  #mem b{color:var(--ink)}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dim);text-align:center;pointer-events:none;background:var(--panel);padding:12px 18px;border-radius:12px}
</style></head><body>
<div id="top">
  <a class="chip" href="../">← Lab</a>
  <button class="chip" id="leave">Leave</button>
  <button class="chip" id="memtoggle">Memories</button>
  <button class="chip" id="musictoggle" title="Play him a song">🎵</button>
  <button class="chip on" id="voicetoggle" title="Hear them speak (tap to mute)">🔊</button>
  <span id="status">loading…</span>
</div>
<div id="hint">Drag to look · WASD or the pad to move · type to talk</div>
<div id="bubble"></div>
<div id="music" style="display:none;position:fixed;left:10px;right:10px;top:60px;max-width:420px;background:rgba(44,42,39,.96);border-radius:12px;padding:12px;z-index:5">
  <b>Play him a song</b>
  <div style="margin:8px 0"><input type="file" id="songfile" accept="audio/*"></div>
  <label style="display:block;margin:6px 0"><input type="checkbox" id="songmine"> I made this</label>
  <input id="songartist" placeholder="Artist (if it isn't yours)" style="width:100%;box-sizing:border-box;margin:4px 0;padding:6px;border-radius:6px;border:1px solid #444;background:#1b1a18;color:#eee">
  <input id="songstyle" placeholder="Style, e.g. your Suno prompt (optional)" style="width:100%;box-sizing:border-box;margin:4px 0;padding:6px;border-radius:6px;border:1px solid #444;background:#1b1a18;color:#eee">
  <textarea id="songlyrics" rows="4" placeholder="Lyrics (optional - if you leave this empty, the words are taken down from the song)" style="width:100%;box-sizing:border-box;margin:4px 0;padding:6px;border-radius:6px;border:1px solid #444;background:#1b1a18;color:#eee"></textarea>
  <div style="display:flex;gap:6px"><button class="chip" id="songplay">▶ Play</button><button class="chip" id="songstop">■ Stop</button><span id="songstate" style="color:#a49c8c;align-self:center;font-size:12px"></span></div>
</div>
<div id="mem"><div id="memlive"></div><div id="away"></div></div>
<div id="pad"><div id="knob"></div></div>
<div id="chat">
  <div id="log"></div>
  <form id="form" autocomplete="off"><button type="button" class="send" id="mic" title="Talk: tap, speak, tap again to send">🎤</button><input id="say" placeholder="Say something…" maxlength="400"><button class="send">Send</button></form>
</div>
<script type="module">
import * as THREE from '../assets/vendor/three/three.module.js';
import { GLTFLoader } from '../assets/vendor/three/three.addons.js';
import { attachAnatomy } from './attach-anatomy.mjs';
import { captureRest } from './retarget.mjs';
import { Reflexes, POSES, setPoses } from './reflexes.mjs';
import { Nav } from './nav.mjs';
import { voice, ears, transcribe } from './voice.mjs';
import { Listener } from './listen.mjs';
import { Bass } from './bass.mjs';
import { Mind, CHARACTERS, timeOfDay } from './mind.mjs';
import { loadProps } from './props.mjs';
import { PLACES } from './places.mjs';
import { wear } from './garments.mjs';

const isPhone = matchMedia('(pointer:coarse)').matches;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 2 : 1.5)); r.setSize(innerWidth, innerHeight);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e0d0b);

// ---------- the place (world/places.mjs): ?place=marco (default) or ?place=dante ----------
const Q = new URLSearchParams(location.search), HR = new Date().getHours();
const PLACE = PLACES[Q.get('place')] || PLACES.marco;
const { W, D, H } = PLACE;
document.title = `THE_LAB · ${PLACE.name}`;
const mat = (c, rough = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(PLACE.floor, 0.75)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(0xe9e4da)); ceil.rotation.x = Math.PI / 2; ceil.position.y = H; scene.add(ceil);
const wallM = mat(PLACE.wall);
const wall = (w, h, x, y, z, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallM); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m; };
wall(W, H, 0, H / 2, -D / 2, 0); wall(W, H, 0, H / 2, D / 2, Math.PI); wall(D, H, -W / 2, H / 2, 0, Math.PI / 2); wall(D, H, W / 2, H / 2, 0, -Math.PI / 2);
// sky behind the window glass (the frame itself is a prop); night or day by the hour
const night = HR < 7 || HR >= 19, WIN = PLACE.window;
const win = new THREE.Mesh(new THREE.PlaneGeometry(WIN.w, WIN.h), new THREE.MeshStandardMaterial({ color: night ? 0x1c2740 : 0x9fc3e6, emissive: night ? 0x3e5f8e : 0xbfdcf5, emissiveIntensity: night ? 0.7 : 0.9, roughness: 1 })); win.position.set(WIN.x, WIN.y, D / 2 - 0.005); win.rotation.y = Math.PI; scene.add(win);

const PROPS = PLACE.props(W, D, H);
PLACE.lights(scene, W, D, H);
// where the mind can send him (standing spots in front of each piece)
const SPOTS = PLACE.spots;

// ---------- the player: a first-person camera on the floor ----------
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
const player = { pos: PLACE.playerStart.pos.clone(), yaw: PLACE.playerStart.yaw, pitch: 0 };   // in at the door, facing the room
const EYE = 1.62;
function placeCam() { cam.position.set(player.pos.x, EYE, player.pos.z); cam.rotation.set(0, 0, 0, 'YXZ'); cam.rotation.y = player.yaw; cam.rotation.x = player.pitch; }
const keys = {}; addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT') keys[e.key.toLowerCase()] = true; }); addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let drag = null, padV = { x: 0, y: 0 };
const pad = document.getElementById('pad'), knob = document.getElementById('knob');
r.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; r.domElement.setPointerCapture(e.pointerId); document.getElementById('hint').style.display = 'none'; });
r.domElement.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; player.yaw -= (e.clientX - drag.x) * 0.004; player.pitch = THREE.MathUtils.clamp(player.pitch - (e.clientY - drag.y) * 0.003, -0.9, 0.9); drag.x = e.clientX; drag.y = e.clientY; });
r.domElement.addEventListener('pointerup', e => { if (drag && drag.id === e.pointerId) drag = null; });
let padId = null;
pad.addEventListener('pointerdown', e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
pad.addEventListener('pointerup', e => { if (e.pointerId === padId) { padId = null; padV = { x: 0, y: 0 }; knob.style.left = '35px'; knob.style.top = '35px'; } });
function padMove(e) { const b = pad.getBoundingClientRect(); let x = (e.clientX - b.left - 55) / 45, y = (e.clientY - b.top - 55) / 45; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } padV = { x, y }; knob.style.left = (35 + x * 35) + 'px'; knob.style.top = (35 + y * 35) + 'px'; }
function movePlayer(dt) {
  let fx = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) - padV.y;
  let sx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + padV.x;
  const l = Math.hypot(fx, sx); if (l > 1) { fx /= l; sx /= l; }
  if (!fx && !sx) return;
  const sp = 1.6 * dt;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
  player.pos.addScaledVector(fwd, fx * sp).addScaledVector(right, sx * sp);
  player.pos.x = THREE.MathUtils.clamp(player.pos.x, -W / 2 + 0.3, W / 2 - 0.3); player.pos.z = THREE.MathUtils.clamp(player.pos.z, -D / 2 + 0.3, D / 2 - 0.3);
  // keep a little personal space from Marco
  for (const R of RES) { const d = player.pos.distanceTo(R.model.position); if (d < 0.55) player.pos.sub(R.model.position).setLength(0.55).add(R.model.position); }
}
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// ---------- the people ----------
const status = document.getElementById('status'), log = document.getElementById('log'), bubble = document.getElementById('bubble'), memEl = document.getElementById('mem'), memLive = document.getElementById('memlive');
const say = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; };
const loader = new GLTFLoader();
const bodies = await (await fetch('../assets/bodies/bodies.json')).json();
const BODY = { marco: 'adult-base-01', dante: 'dante' };
const hostKey = PLACE.host, G = PLACE.guest;
const KEYS = { Marco: 'marco', Dante: 'dante' };
// who is actually here: their lives (supabase/functions/life) say where each man is. ?marco=1 /
// ?dante=1 force someone here, ?alone=1 forces the host alone (for testing).
let WORLD = { people: [] };
try { const w = await (await fetch('https://qyphdwcjzhgobsfpeonh.supabase.co/functions/v1/life?who=1')).json(); if (Array.isArray(w.people)) WORLD = w; } catch (_) { /* offline: the host is home */ }
const whereOf = key => WORLD.people.find(p => KEYS[p.name] === key)?.where || null;
const forced = key => Q.has(key);
const hereNow = key => forced(key) || (!Q.has('alone') && (whereOf(key) === PLACE.location || (whereOf(key) == null && key === hostKey)));
const hostHere = hereNow(hostKey), guestHere = !!G && hereNow(G.key);
const hspec = bodies.find(b => b.id === BODY[hostKey]), gspec = G && bodies.find(b => b.id === BODY[G.key]);
const tier = isPhone ? 'mobile' : 'desktop';
const [g, pack, pack2, props, gd] = await Promise.all([hostHere ? loader.loadAsync('../assets/bodies/' + hspec[tier]) : null, loader.loadAsync('../assets/anims/meshy-pack-01.glb'), loader.loadAsync('../assets/anims/meshy-pack-02.glb'), loadProps(loader, PROPS, { tier }), guestHere ? loader.loadAsync('../assets/bodies/' + gspec[tier]) : null]);
for (const o of props) scene.add(o);
// things that glow (the floor lamp, a candle)
for (const P of PROPS) if (P.glow) props.filter(o => o.name === P.id).forEach(o => o.traverse(m => { if (m.isMesh) { m.material = m.material.clone(); m.material.emissive.set(P.glow); m.material.emissiveIntensity = 0.35; } }));
// held poses: the repo's tuned set, then any you've saved on this device from lab/pose.html
try { setPoses(await (await fetch('poses.json')).json()); } catch (_) { /* defaults */ }
try { const mine = localStorage.getItem('lab.poses'); if (mine) setPoses(JSON.parse(mine)); } catch (_) { /* none */ }
// the floor map: every resident walks around the furniture
const nav = new Nav(W, D, props);
const PACKS = [{ rest: captureRest(pack.scene, { allNodes: true }), clips: pack.animations }, { rest: captureRest(pack2.scene, { allNodes: true }), clips: pack2.animations }];
// where the hips go: the sofa seat (the host's end, the guest's), the bed, a back to the counter
const SEATS = PLACE.seats;
const wardrobe = await (await fetch('../assets/garments/garments.json')).json();
const LOWER = ['jeans', 'boxerbriefs', 'chinos', 'sweatpants', 'apron', 'pajamapants', 'sleepshorts', 'briefs', 'cargopants', 'chefpants', 'basketballshorts'];
const WARM = { Nude: -2, Underwear: -1, 'Underwear (briefs)': -1, 'Sleep shorts': -1, 'Home: shorts': -1, Lounging: 0, 'Socks + sweats': 0, 'Home: shorts + thermal': 0, Sleepwear: 0.5, 'Tee + jeans': 0.5, 'Off duty': 0.5, 'Behind the bar': 1, 'In the kitchen': 1, 'Flannel over tee': 1.5, 'Off duty + bomber': 2, 'Hoodie + jeans': 2, 'Denim jacket': 2 };
const bass = PLACE.bass && props.find(o => o.name === PLACE.bass), bassHome = bass && { p: bass.position.clone(), r: bass.rotation.clone() };
// the sound of it: from wherever the bass is, louder as you walk up. How clean he plays comes
// from practice - his off-screen life logs it (memories about the bass / the bridge)
const bassSound = new Bass({ at: () => bass ? bass.position : new THREE.Vector3(), ear: () => player.pos });
fetch('https://qyphdwcjzhgobsfpeonh.supabase.co/functions/v1/life?skill=bass').then(r => r.json()).then(d => { if (typeof d.skill === 'number') bassSound.skill = d.skill; }).catch(() => {});

// one person living (or visiting) here: body, reflexes, anatomy, clothes, mind
async function resident({ key, name, model, bodySpec, seed, outfitFor, place, isHost }) {
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  scene.add(model);
  // (rest capture and the anatomy attach read the model at the origin; place him after)
  const reflex = new Reflexes(model, PACKS, { seats: isHost ? SEATS : { ...SEATS, sofa: SEATS.sofa2 } });
  const anat = attachAnatomy(model, bodySpec.anatomy, {}, { seed });
  reflex.nav = nav;
  const R = { key, name, model, reflex, anat, mind: new Mind(CHARACTERS[key], { location: PLACE.location }), place, outfit: null, worn: [], dressing: 0, needs: null, head: reflex.bone('Head') };
  R.OUTFITS = { Nude: [] };
  for (const o of wardrobe.outfits) if (o.items.every(id => (wardrobe.garments.find(g => g.id === id)?.bodies || []).includes(bodySpec.id))) R.OUTFITS[o.name] = o.items;
  R.comfort = () => Math.max(0, Math.min(1, Math.abs(WARM[R.outfit] ?? 0) / 3));
  R.warmth = () => 50 + 6 * (WARM[R.outfit] ?? 0) + (R.needs && R.needs.energy < 0.3 ? 10 : 0);
  R.dress = async nm => {
    if (!(nm in R.OUTFITS)) return; const tok = ++R.dressing;
    R.worn.forEach(w => w.remove()); R.worn = []; R.outfit = nm;
    anat.setVisible(!R.OUTFITS[nm].some(id => LOWER.includes(id)));
    for (const id of R.OUTFITS[nm]) { const w = await wear(loader, model, `../assets/garments/${id}/${bodySpec.id}${isPhone ? '.mobile' : ''}.glb`); if (tok !== R.dressing) { w.remove(); return; } R.worn.push(w); }
    window.__dressed = window.__dressed || {}; window.__dressed[key] = nm; anat.setWarmth?.(R.warmth());
  };
  await R.dress(outfitFor(R.OUTFITS));
  reflex.onChange = nm => R.dress(nm);
  // the bass: off its stand and into his lap while he plays, back after
  reflex.onHold = (h, on) => {
    if (h !== 'play_bass' || !bass) return; R.bassOn = on;
    if (on) {
      let bad = 0, bars = 0;
      bassSound.play(null, { onBar: b => { bars++; if (b.bridge && b.mistakes >= 2) { bad++; if (Math.random() < 0.5) R.reflex.gesture('shake', 0.9); } } });
      R.bassReport = () => bars ? `${R.name} played his bass for a bit (${bars} bars; the bridge went wrong ${bad} time${bad === 1 ? '' : 's'})` : null;
    }
    else { bassSound.stop(); bass.position.copy(bassHome.p); bass.rotation.copy(bassHome.r);
      // what was heard goes to everyone's next turn (his own included - he knows how it went)
      const rep = R.bassReport?.(); if (rep) for (const o of RES) o.mind.hear(o === R ? 'you' : 'in the room', rep.replace(R.name + ' played his', o === R ? 'you played your' : R.name + ' played his')); R.bassReport = null; }
  };
  return R;
}

// what each one wears at home by the hour, and what he turns up in as a guest
const pick = (O, ...names) => names.find(n => O[n]) || 'Nude';
const HOME = {
  // (a bartender's day: off work about 2 am, asleep till late morning, home in the afternoon, at the bar by evening)
  marco: O => { const h = HR; if (h >= 2 && h < 4) return pick(O, 'Behind the bar', 'Tee + jeans'); if (h >= 4 && h < 11) return pick(O, 'Sleepwear'); if (h >= 11 && h < 18) return pick(O, 'Lounging', 'Tee + jeans'); return pick(O, 'Tee + jeans'); },
  // (a line cook: home from close about 1, asleep till 10, his own morning, in by 3)
  dante: O => { const h = HR; if (h >= 1 && h < 3) return pick(O, 'In the kitchen', 'Off duty'); if (h >= 3 && h < 10) return pick(O, 'Sleepwear', 'Home: shorts'); if (h >= 10 && h < 14) return pick(O, 'Home: shorts', 'Home: shorts + thermal', 'Off duty'); return pick(O, 'Off duty', 'Tee + jeans'); },
};
const GUEST = { dante: O => pick(O, 'In the kitchen', 'Off duty'), marco: O => pick(O, 'Tee + jeans', 'Off duty') };
const NAME = { marco: 'Marco', dante: 'Dante' };
const RES = [];
const WHERE_WORD = { 'marco-apartment': "at Marco's", 'dante-apartment': "at Dante's", 'the-bar': 'at the bar', out: 'out' };
// bring someone in: the host appears where he'd be; anyone else comes through the door
async function arrive(key, { model = null, atDoor = false } = {}) {
  if (RES.some(R => R.key === key)) return RES.find(R => R.key === key);
  const isHost = key === hostKey, spec = isHost ? hspec : gspec;
  const m = model || (await loader.loadAsync('../assets/bodies/' + spec[tier])).scene;
  const R = await resident({ key, name: NAME[key], model: m, bodySpec: spec, seed: key, outfitFor: isHost ? HOME[key] : GUEST[key], place: isHost ? null : G.place, isHost });
  if (isHost && !atDoor) { R.model.position.copy(SPOTS[PLACE.spawnHost.at]); R.model.rotation.y = PLACE.spawnHost.yaw; }
  else { R.model.position.copy(SPOTS.door); R.model.rotation.y = 0; R.reflex.do({ type: 'walk_to', target: isHost ? PLACE.spawnHost.at : G.first }); }
  RES.push(R); return R;
}
// someone goes: walks out the door and is gone; the others see it
function depart(R, why) {
  R.leaving = true; R.reflex.clear(); R.reflex.hold = null; R.reflex.lookAt(null);
  R.reflex._standThen(() => R.reflex.walkTo(SPOTS.door, () => {
    say('sys', `${R.name} leaves${why ? ` (${why})` : ''}`); scene.remove(R.model); R.worn.forEach(w => w.remove()); RES.splice(RES.indexOf(R), 1);
    for (const o of RES) talk({ event: 'someone_leaves', who_moved: R.name }, o);
  }));
}
if (hostHere) await arrive(hostKey, { model: g.scene });
if (guestHere) await arrive(G.key, { model: gd.scene, atDoor: true });
const M = RES[0] || null;
if (!hostHere) { const w = whereOf(hostKey); say('sys', `${NAME[hostKey]} isn't home${w ? ` - he's ${WHERE_WORD[w] || w}` : ''}${RES.length ? '' : '. The place is empty.'}`); }
const marco = M?.model, reflex = M?.reflex, mind = M?.mind, anat = M?.anat;
window.__ready = true;
let bubbleUntil = 0, bubbleOf = M;
function showBubble(R, text) { bubbleOf = R; bubble.textContent = text; bubble.style.display = text ? 'block' : 'none'; bubbleUntil = performance.now() + 1500 + text.length * 55; }
const _hp = new THREE.Vector3();
function placeBubble() {
  if (bubble.style.display === 'none') return;
  if (performance.now() > bubbleUntil) { bubble.style.display = 'none'; return; }
