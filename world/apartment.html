<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>THE_LAB · Marco's apartment</title>
<style>
  :root{--panel:rgba(28,26,23,.86);--ink:#eee;--dim:#a49c8c;--gold:#d8b25a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#15130f;color:var(--ink);font:15px system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block}
  #top{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;pointer-events:none}
  #top>*{pointer-events:auto}
  .chip{background:var(--panel);border:0;color:var(--ink);padding:8px 13px;border-radius:999px;font:inherit;cursor:pointer;text-decoration:none;backdrop-filter:blur(6px)}
  .chip.on{background:var(--gold);color:#1b1a18}
  #status{color:var(--dim);font-size:13px;margin-left:auto;background:var(--panel);padding:6px 10px;border-radius:999px}
  #bubble{position:fixed;transform:translate(-50%,-100%);max-width:min(70vw,420px);background:#f4efe6;color:#1b1a18;padding:10px 14px;border-radius:14px;line-height:1.35;display:none;pointer-events:none;box-shadow:0 6px 24px rgba(0,0,0,.35)}
  #bubble:after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-8px;border:8px solid transparent;border-top-color:#f4efe6;border-bottom:0}
  #chat{position:fixed;left:10px;right:10px;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;pointer-events:none}
  #log{max-height:28vh;overflow:auto;display:flex;flex-direction:column;gap:4px;pointer-events:auto;padding-right:4px}
  .msg{background:var(--panel);padding:7px 11px;border-radius:12px;max-width:80%;line-height:1.3;backdrop-filter:blur(6px)}
  .msg.me{align-self:flex-end;background:rgba(216,178,90,.22)}
  .msg.sys{align-self:center;color:var(--dim);font-size:12px;background:transparent}
  form{display:flex;gap:6px;pointer-events:auto}
  input{flex:1;background:var(--panel);border:1px solid #3d3a35;color:var(--ink);padding:11px 14px;border-radius:999px;font:inherit;outline:none;backdrop-filter:blur(6px)}
  button.send{background:var(--gold);border:0;color:#1b1a18;padding:0 16px;border-radius:999px;font:inherit;font-weight:600}
  #pad{position:fixed;left:16px;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 120px);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);display:none}
  #knob{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.25)}
  @media (pointer:coarse){#pad{display:block}}
  #mem{position:fixed;top:52px;right:10px;width:min(360px,80vw);max-height:50vh;overflow:auto;background:var(--panel);border-radius:12px;padding:10px 12px;font-size:12px;color:var(--dim);display:none;backdrop-filter:blur(6px)}
  #mem b{color:var(--ink)}
  #hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);color:var(--dim);text-align:center;pointer-events:none;background:var(--panel);padding:12px 18px;border-radius:12px}
</style></head><body>
<div id="top">
  <a class="chip" href="../">← Lab</a>
  <button class="chip" id="leave">Leave</button>
  <button class="chip" id="memtoggle">Memories</button>
  <span id="status">loading…</span>
</div>
<div id="hint">Drag to look · WASD or the pad to move · type to talk</div>
<div id="bubble"></div>
<div id="mem"></div>
<div id="pad"><div id="knob"></div></div>
<div id="chat">
  <div id="log"></div>
  <form id="form" autocomplete="off"><input id="say" placeholder="Say something to Marco…" maxlength="400"><button class="send">Send</button></form>
</div>
<script type="module">
import * as THREE from '../assets/vendor/three/three.module.js';
import { GLTFLoader } from '../assets/vendor/three/three.addons.js';
import { attachAnatomy } from './attach-anatomy.mjs';
import { captureRest } from './retarget.mjs';
import { Reflexes } from './reflexes.mjs';
import { Mind, CHARACTERS, timeOfDay } from './mind.mjs';
import { loadProps } from './props.mjs';
import { wear } from './garments.mjs';

const isPhone = matchMedia('(pointer:coarse)').matches;
const r = new THREE.WebGLRenderer({ antialias: true });
r.setPixelRatio(Math.min(devicePixelRatio, isPhone ? 2 : 1.5)); r.setSize(innerWidth, innerHeight);
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0e0d0b);

// ---------- the room: 6 x 4.5 m studio, door on the -z wall, window on +z ----------
const W = 6, D = 4.5, H = 2.7;
const mat = (c, rough = 0.9) => new THREE.MeshStandardMaterial({ color: c, roughness: rough, metalness: 0 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(0x6b5236, 0.75)); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(W, D), mat(0xe9e4da)); ceil.rotation.x = Math.PI / 2; ceil.position.y = H; scene.add(ceil);
const wallM = mat(0xcfc6b8);
const wall = (w, h, x, y, z, ry) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), wallM); m.position.set(x, y, z); m.rotation.y = ry; m.receiveShadow = true; scene.add(m); return m; };
wall(W, H, 0, H / 2, -D / 2, 0); wall(W, H, 0, H / 2, D / 2, Math.PI); wall(D, H, -W / 2, H / 2, 0, Math.PI / 2); wall(D, H, W / 2, H / 2, 0, -Math.PI / 2);
// night sky behind the window glass (the frame itself is a prop)
const win = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.4), new THREE.MeshStandardMaterial({ color: 0x1c2740, emissive: 0x3e5f8e, emissiveIntensity: 0.7, roughness: 1 })); win.position.set(-0.8, 1.75, D / 2 - 0.005); win.rotation.y = Math.PI; scene.add(win);

// ---------- the furniture: Meshy props (assets/props), placed by floor centre + yaw ----------
// Entry wall (-z): door, TV, the table and two chairs.  Kitchen along +x: fridge in the corner,
// the island.  Bed on the +z wall with the nightstand in the corner.  Living on the -x side:
// sofa under the window, coffee table, armchair, floor lamp in the corner, bookshelf on the -x wall.
const PROPS = [
  { id: 'door',        x: 0,     z: -D / 2 + 0.095, ry: 0 },
  { id: 'tv',          x: -1.3,  z: -D / 2 + 0.14,  ry: 0 },
  { id: 'diningtable', x: 1.0,   z: -1.55, ry: 0 },
  { id: 'chair',       x: 0.7,   z: -0.82, ry: Math.PI },
  { id: 'chair',       x: 1.3,   z: -0.82, ry: Math.PI },
  { id: 'fridge',      x: W / 2 - 0.24, z: -D / 2 + 0.30, ry: -Math.PI / 2 },
  { id: 'counter',     x: W / 2 - 0.54, z: -0.85, ry: -Math.PI / 2 },
  { id: 'bed',         x: 1.75,  z: D / 2 - 0.92, ry: Math.PI },
  { id: 'nightstand',  x: W / 2 - 0.26, z: D / 2 - 0.24, ry: -Math.PI / 2 },
  { id: 'window',      x: -0.8,  y: 1.0, z: D / 2 - 0.07, ry: Math.PI, shadow: false },   // sill at 1 m
  { id: 'sofa',        x: -0.8,  z: D / 2 - 0.46, ry: Math.PI },
  { id: 'coffeetable', x: -0.8,  z: 0.75, ry: 0 },
  { id: 'armchair',    x: -2.3,  z: 0.45, ry: Math.PI / 2 },
  { id: 'floorlamp',   x: -2.15, z: 2.0,  ry: 0, shadow: false },
  { id: 'bookshelf',   x: -W / 2 + 0.21, z: -0.95, ry: Math.PI / 2 },
  // small things (batch 2): surface heights are the baked tops (table 0.718, counter 1.043, coffee table 0.322)
  { id: 'bassguitar',  x: 0.45,  z: 1.95, ry: Math.PI - 0.3 },
  { id: 'laptop',      x: 0.85,  y: 0.718, z: -1.4, ry: 0.15 },
  { id: 'mug',         x: 1.35,  y: 0.718, z: -1.3, ry: 0.8, shadow: false },
  { id: 'keysbowl',    x: 0.45,  y: 0.718, z: -1.85, ry: 0, shadow: false },
  { id: 'plate',       x: 2.45,  y: 1.043, z: -0.42, ry: 0, shadow: false },
  { id: 'glass',       x: 2.2,   y: 1.043, z: -0.62, ry: 0, shadow: false },
  { id: 'pintglass',   x: 2.35,  y: 1.043, z: -1.42, ry: 0, shadow: false },
  { id: 'beerbottle',  x: -0.55, y: 0.322, z: 0.82, ry: 0, shadow: false },
  // batch 3: making it his
  { id: 'rug',          x: -0.8,  z: 0.75, ry: 0, shadow: false },
  { id: 'stove',        x: W / 2 - 0.33, z: 0.18, ry: -Math.PI / 2 },
  { id: 'microwave',    x: 2.6,   y: 1.043, z: -1.45, ry: -Math.PI / 2 },
  { id: 'wallshelf',    x: W / 2 - 0.125, y: 1.6, z: -0.85, ry: -Math.PI / 2, shadow: false },
  { id: 'liquorbottle', x: 2.25,  y: 1.043, z: -1.15, ry: 0.4, shadow: false },
  { id: 'trashcan',     x: 2.15,  z: -2.02, ry: 0 },
  { id: 'barcart',      x: -W / 2 + 0.16, z: -0.2, ry: Math.PI / 2 },
  { id: 'shaker',       x: -2.84, y: 0.81, z: -0.38, ry: 0, shadow: false },
  { id: 'bassamp',      x: 0.78,  z: 2.08, ry: Math.PI - 0.15 },
  { id: 'turntable',    x: -W / 2 + 0.16, z: 1.15, ry: Math.PI / 2 },
  { id: 'recordcrate',  x: -2.86, z: 0.75, ry: Math.PI / 2, shadow: false },
  { id: 'wallart',      x: -W / 2 + 0.045, y: 1.25, z: 0.45, ry: Math.PI / 2, shadow: false },
  { id: 'wallclock',    x: 1.0,   y: 2.0, z: -D / 2 + 0.012, ry: 0, shadow: false },
  { id: 'plant',        x: -2.68, z: 1.95, ry: 0.6 },
  { id: 'smallplant',   x: -2.79, y: 1.9, z: -0.95, ry: 0, shadow: false },
  { id: 'throwblanket', x: -1.55, y: 0.45, z: 1.85, ry: 0.3, shadow: false },
  { id: 'bookstack',    x: 2.74,  y: 0.551, z: 1.99, ry: 0.2, shadow: false },
  { id: 'coatrack',     x: -0.56, z: -1.85, ry: 0 },
  { id: 'shoes',        x: -0.95, z: -1.7, ry: 0.3, shadow: false },
  { id: 'laundrybasket', x: 2.78, z: 0.78, ry: -Math.PI / 2 },
  { id: 'curtain',      x: -1.72, y: 0.32, z: D / 2 - 0.09, ry: Math.PI, shadow: false },
  { id: 'curtain',      x: 0.12,  y: 0.32, z: D / 2 - 0.09, ry: Math.PI, shadow: false },
  { id: 'ceilinglight', x: -0.8,  y: H - 0.64, z: 0.75, ry: 0, shadow: false },
  { id: 'bathroomdoor', x: -W / 2 + 0.1, z: -1.8, ry: Math.PI / 2 },
  { id: 'towel',        x: -2.3,  y: 0.9, z: -D / 2 + 0.1, ry: 0, shadow: false },
];

// ---------- light: lamp + window + a soft fill ----------
scene.add(new THREE.HemisphereLight(0xe9dcc6, 0x2a221a, 0.45));
const lamp = new THREE.PointLight(0xffc27a, 14, 9, 1.6); lamp.position.set(-2.15, 1.45, 2.0); lamp.castShadow = true; lamp.shadow.mapSize.set(1024, 1024); lamp.shadow.bias = -0.002; scene.add(lamp);
const cool = new THREE.DirectionalLight(0xa9c4e6, 0.9); cool.position.set(-0.8, 1.8, D / 2 - 0.2); cool.target.position.set(-0.3, 0.6, 0); scene.add(cool, cool.target);
const kitchen = new THREE.PointLight(0xfff1dc, 5, 6, 1.8); kitchen.position.set(2.1, 2.15, -0.85); scene.add(kitchen);

// where the mind can send him (standing spots in front of each piece)
const SPOTS = { sofa: new THREE.Vector3(-0.4, 0, 1.22), kitchen: new THREE.Vector3(1.5, 0, -0.3), window: new THREE.Vector3(0.65, 0, 1.6), door: new THREE.Vector3(0, 0, -1.3), table: new THREE.Vector3(0.3, 0, -0.4), bed: new THREE.Vector3(1.75, 0, 0.2), shelf: new THREE.Vector3(-2.2, 0, -1.0) };

// ---------- the player: a first-person camera on the floor ----------
const cam = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 50);
const player = { pos: new THREE.Vector3(0, 0, -1.6), yaw: Math.PI, pitch: 0 };   // in at the door, facing the room
const EYE = 1.62;
function placeCam() { cam.position.set(player.pos.x, EYE, player.pos.z); cam.rotation.set(0, 0, 0, 'YXZ'); cam.rotation.y = player.yaw; cam.rotation.x = player.pitch; }
const keys = {}; addEventListener('keydown', e => { if (e.target.tagName !== 'INPUT') keys[e.key.toLowerCase()] = true; }); addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
let drag = null, padV = { x: 0, y: 0 };
const pad = document.getElementById('pad'), knob = document.getElementById('knob');
r.domElement.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, id: e.pointerId }; r.domElement.setPointerCapture(e.pointerId); document.getElementById('hint').style.display = 'none'; });
r.domElement.addEventListener('pointermove', e => { if (!drag || drag.id !== e.pointerId) return; player.yaw -= (e.clientX - drag.x) * 0.004; player.pitch = THREE.MathUtils.clamp(player.pitch - (e.clientY - drag.y) * 0.003, -0.9, 0.9); drag.x = e.clientX; drag.y = e.clientY; });
r.domElement.addEventListener('pointerup', e => { if (drag && drag.id === e.pointerId) drag = null; });
let padId = null;
pad.addEventListener('pointerdown', e => { padId = e.pointerId; pad.setPointerCapture(e.pointerId); padMove(e); });
pad.addEventListener('pointermove', e => { if (e.pointerId === padId) padMove(e); });
pad.addEventListener('pointerup', e => { if (e.pointerId === padId) { padId = null; padV = { x: 0, y: 0 }; knob.style.left = '35px'; knob.style.top = '35px'; } });
function padMove(e) { const b = pad.getBoundingClientRect(); let x = (e.clientX - b.left - 55) / 45, y = (e.clientY - b.top - 55) / 45; const l = Math.hypot(x, y); if (l > 1) { x /= l; y /= l; } padV = { x, y }; knob.style.left = (35 + x * 35) + 'px'; knob.style.top = (35 + y * 35) + 'px'; }
function movePlayer(dt) {
  let fx = (keys['w'] || keys['arrowup'] ? 1 : 0) - (keys['s'] || keys['arrowdown'] ? 1 : 0) - padV.y;
  let sx = (keys['d'] || keys['arrowright'] ? 1 : 0) - (keys['a'] || keys['arrowleft'] ? 1 : 0) + padV.x;
  const l = Math.hypot(fx, sx); if (l > 1) { fx /= l; sx /= l; }
  if (!fx && !sx) return;
  const sp = 1.6 * dt;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw)), right = new THREE.Vector3(fwd.z, 0, -fwd.x);
  player.pos.addScaledVector(fwd, fx * sp).addScaledVector(right, sx * sp);
  player.pos.x = THREE.MathUtils.clamp(player.pos.x, -W / 2 + 0.3, W / 2 - 0.3); player.pos.z = THREE.MathUtils.clamp(player.pos.z, -D / 2 + 0.3, D / 2 - 0.3);
  // keep a little personal space from Marco
  if (marco) { const d = player.pos.distanceTo(marco.position); if (d < 0.55) player.pos.sub(marco.position).setLength(0.55).add(marco.position); }
}
addEventListener('resize', () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });

// ---------- Marco ----------
const status = document.getElementById('status'), log = document.getElementById('log'), bubble = document.getElementById('bubble'), memEl = document.getElementById('mem');
const say = (cls, text) => { const d = document.createElement('div'); d.className = 'msg ' + cls; d.textContent = text; log.appendChild(d); log.scrollTop = log.scrollHeight; };
const loader = new GLTFLoader();
const bodies = await (await fetch('../assets/bodies/bodies.json')).json();
const spec = bodies.find(b => b.id === 'adult-base-01');
const Q = new URLSearchParams(location.search), HR = new Date().getHours();
// Dante (the chef) comes over after his shift, about 2-5 am - or ?dante=1 to have him here now
const withDante = Q.has('dante') || (HR >= 2 && HR < 5);
const dspec = bodies.find(b => b.id === 'dante');
const tier = isPhone ? 'mobile' : 'desktop';
const [g, pack, pack2, props, gd] = await Promise.all([loader.loadAsync('../assets/bodies/' + spec[tier]), loader.loadAsync('../assets/anims/meshy-pack-01.glb'), loader.loadAsync('../assets/anims/meshy-pack-02.glb'), loadProps(loader, PROPS, { tier }), withDante ? loader.loadAsync('../assets/bodies/' + dspec[tier]) : null]);
for (const o of props) scene.add(o);
props.filter(o => o.name === 'floorlamp').forEach(o => o.traverse(m => { if (m.isMesh) { m.material = m.material.clone(); m.material.emissive.set(0xffc77a); m.material.emissiveIntensity = 0.35; } }));
const PACKS = [{ rest: captureRest(pack.scene, { allNodes: true }), clips: pack.animations }, { rest: captureRest(pack2.scene, { allNodes: true }), clips: pack2.animations }];
// where the hips go: the sofa seat, the bed (lying head to the pillows), his back to the kitchen counter
const SEATS = { sofa: { pos: new THREE.Vector3(-0.8, 0, 1.74), yaw: Math.PI, y: 0.02 }, sofa2: { pos: new THREE.Vector3(-0.2, 0, 1.74), yaw: Math.PI, y: 0.02 },
  bed: { pos: new THREE.Vector3(1.75, 0.43, 1.46), yaw: Math.PI, side: new THREE.Vector3(1.05, 0, 1.35) }, counter: { pos: SPOTS.kitchen.clone(), yaw: -Math.PI / 2 } };
const wardrobe = await (await fetch('../assets/garments/garments.json')).json();
const LOWER = ['jeans', 'boxerbriefs', 'chinos', 'sweatpants', 'apron', 'pajamapants', 'sleepshorts', 'briefs', 'cargopants', 'chefpants', 'basketballshorts'];
const WARM = { Nude: -2, Underwear: -1, 'Underwear (briefs)': -1, 'Sleep shorts': -1, 'Home: shorts': -1, Lounging: 0, 'Socks + sweats': 0, 'Home: shorts + thermal': 0, Sleepwear: 0.5, 'Tee + jeans': 0.5, 'Off duty': 0.5, 'Behind the bar': 1, 'In the kitchen': 1, 'Flannel over tee': 1.5, 'Off duty + bomber': 2, 'Hoodie + jeans': 2, 'Denim jacket': 2 };
const bass = props.find(o => o.name === 'bassguitar'), bassHome = bass && { p: bass.position.clone(), r: bass.rotation.clone() };

// one person living (or visiting) here: body, reflexes, anatomy, clothes, mind
async function resident({ key, name, model, bodySpec, seed, outfitFor, place }) {
  model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; o.frustumCulled = false; } });
  scene.add(model);
  // (rest capture and the anatomy attach read the model at the origin; place him after)
  const reflex = new Reflexes(model, PACKS, { seats: key === 'marco' ? SEATS : { ...SEATS, sofa: SEATS.sofa2 } });
  const anat = attachAnatomy(model, bodySpec.anatomy, {}, { seed });
  const R = { key, name, model, reflex, anat, mind: new Mind(CHARACTERS[key]), place, outfit: null, worn: [], dressing: 0, needs: null, head: reflex.bone('Head') };
  R.OUTFITS = { Nude: [] };
  for (const o of wardrobe.outfits) if (o.items.every(id => (wardrobe.garments.find(g => g.id === id)?.bodies || []).includes(bodySpec.id))) R.OUTFITS[o.name] = o.items;
  R.comfort = () => Math.max(0, Math.min(1, Math.abs(WARM[R.outfit] ?? 0) / 3));
  R.warmth = () => 50 + 6 * (WARM[R.outfit] ?? 0) + (R.needs && R.needs.energy < 0.3 ? 10 : 0);
  R.dress = async nm => {
    if (!(nm in R.OUTFITS)) return; const tok = ++R.dressing;
    R.worn.forEach(w => w.remove()); R.worn = []; R.outfit = nm;
    anat.setVisible(!R.OUTFITS[nm].some(id => LOWER.includes(id)));
    for (const id of R.OUTFITS[nm]) { const w = await wear(loader, model, `../assets/garments/${id}/${bodySpec.id}${isPhone ? '.mobile' : ''}.glb`); if (tok !== R.dressing) { w.remove(); return; } R.worn.push(w); }
    window.__dressed = window.__dressed || {}; window.__dressed[key] = nm; anat.setWarmth?.(R.warmth());
  };
  await R.dress(outfitFor(R.OUTFITS));
  reflex.onChange = nm => R.dress(nm);
  // the bass: off its stand and into his lap while he plays, back after
  reflex.onHold = (h, on) => { if (h !== 'play_bass' || !bass) return; R.bassOn = on; if (!on) { bass.position.copy(bassHome.p); bass.rotation.copy(bassHome.r); } };
  return R;
}

// (a bartender's day: off work about 2 am, asleep till late morning, home in the afternoon, at the bar
// by evening - if you find him home then, it's his night off)
const marcoOutfit = O => { const h = HR; if (h >= 2 && h < 4) return O['Behind the bar'] ? 'Behind the bar' : 'Tee + jeans'; if (h >= 4 && h < 11) return O['Sleepwear'] ? 'Sleepwear' : 'Nude'; if (h >= 11 && h < 18) return 'Lounging'; return 'Tee + jeans'; };
// (Dante comes straight from the line: still in his kitchen whites if they fit, else off-duty)
const danteOutfit = O => O['In the kitchen'] ? 'In the kitchen' : O['Off duty'] ? 'Off duty' : Object.keys(O)[1] || 'Nude';
const M = await resident({ key: 'marco', name: 'Marco', model: g.scene, bodySpec: spec, seed: 'marco', outfitFor: marcoOutfit });
M.model.position.copy(SPOTS.kitchen); M.model.rotation.y = Math.PI / 2 - 0.5;   // at the counter
const RES = [M];
if (withDante) {
  const Dn = await resident({ key: 'dante', name: 'Dante', model: gd.scene, bodySpec: dspec, seed: 'dante', outfitFor: danteOutfit, place: "at your friend Marco's apartment - you came over after your shift" });
  Dn.model.position.copy(SPOTS.door); Dn.model.rotation.y = 0;
  Dn.reflex.do({ type: 'walk_to', target: 'table' });
  RES.push(Dn);
}
const marco = M.model, reflex = M.reflex, mind = M.mind, anat = M.anat;
let bubbleUntil = 0, bubbleOf = M;
function showBubble(R, text) { bubbleOf = R; bubble.textContent = text; bubble.style.display = text ? 'block' : 'none'; bubbleUntil = performance.now() + 1500 + text.length * 55; }
const _hp = new THREE.Vector3();
function placeBubble() {
  if (bubble.style.display === 'none') return;
  if (performance.now() > bubbleUntil) { bubble.style.display = 'none'; return; }
  bubbleOf.head.getWorldPosition(_hp); _hp.y += 0.25; _hp.project(cam);
  const behind = _hp.z > 1; bubble.style.left = ((_hp.x + 1) / 2 * innerWidth) + 'px'; bubble.style.top = ((1 - _hp.y) / 2 * innerHeight) + 'px'; bubble.style.opacity = behind ? 0 : 1;
}
function sceneState(R) {
  return { time: timeOfDay(), hour: HR, comfort: +R.comfort().toFixed(2), player_distance_m: +player.pos.distanceTo(R.model.position).toFixed(2), spots: Object.keys(SPOTS), wearing: R.outfit, wardrobe: Object.keys(R.OUTFITS),
    ...(R.place ? { place: R.place } : {}),
    others: RES.filter(o => o !== R).map(o => ({ id: CHARACTERS[o.key], name: o.name, wearing: o.outfit, distance_m: +o.model.position.distanceTo(R.model.position).toFixed(1) })) };
}
function showMemories(R, d) {
  if (!d) return;
  R.needs = d.needs || R.needs; R.anat.setWarmth?.(R.warmth());
  const bar = (k, v, inv) => { const x = inv ? 1 - v : v; return `<span style="display:inline-block;width:70px">${k}</span><span style="display:inline-block;width:90px;height:7px;background:#333;border-radius:4px;vertical-align:middle"><span style="display:block;height:7px;width:${Math.round(x * 90)}px;border-radius:4px;background:${x > 0.66 ? '#d9534f' : x > 0.4 ? '#d8b25a' : '#6c6'}"></span></span>`; };
  const needsHtml = d.needs ? `<b>${R.name}'s needs</b> <i>(bar = how pressing)</i><br>` + bar('tired', d.needs.energy, true) + '<br>' + bar('hunger', d.needs.hunger) + '<br>' + bar('company', d.needs.social) + '<br>' + bar('closeness', d.needs.intimacy) + '<br>' + bar('discomfort', d.needs.comfort) + '<br>' : '';
  memEl.innerHTML = needsHtml + `<b>model</b> ${d.model || ''}${d.salvaged ? ' <i>(reply was cut short; line salvaged)</i>' : ''}<br><b>mood</b> ${JSON.stringify(d.mood)}<br><b>remembered now</b> ${d.memory && d.memory.content ? `(${d.memory.importance}) ${d.memory.content}` : '–'}<br><b>recalled</b><br>` + (d.recalled || []).map(m => `· ${m.content} <i>(${m.when})</i>`).join('<br>');
}
// one mind's turn; what it says, everyone else in the room hears
async function talk(opts, R = M) {
  status.textContent = `${R.name} is thinking…`;
  try {
    const d = await R.mind.send({ ...opts, scene: sceneState(R) });
    if (!d) return null;
    R.reflex.clear(); if (R.reflex.posture === 'stand') R.reflex.lookAt(new THREE.Vector3(player.pos.x, EYE - 0.05, player.pos.z));
    for (const a of d.actions || []) R.reflex.do(a);
    if (d.say) { say('him', `${R.name}: ${d.say}`); showBubble(R, d.say); for (const o of RES) if (o !== R) o.mind.hear(R.name, d.say); }
    showMemories(R, d); status.textContent = `visit · ${R.mind.history.length} turns`;
    return d;
  } catch (e) { say('sys', `${R.name} is out of reach: ${e.message}`); status.textContent = 'offline'; return null; }
}
// you talk to whoever you're facing (or nearest): the other one hears you and may chime in
function addressee() {
  if (RES.length < 2) return M;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw ?? 0), 0, -Math.cos(player.yaw ?? 0));
  let best = M, bs = -1e9;
  for (const R of RES) { const v = R.model.position.clone().sub(player.pos); v.y = 0; const d = v.length(); const s = v.normalize().dot(fwd) * 2 - d * 0.5; if (s > bs) { bs = s; best = R; } }
  return best;
}
if (isPhone) document.getElementById('say').addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault(); const inp = document.getElementById('say'); const t = inp.value.trim(); if (!t || RES.some(R => R.mind.busy)) return;
  inp.value = ''; say('me', t);
  const R = addressee(); for (const o of RES) if (o !== R) o.mind.hear('the visitor', t);
  await talk({ text: t }, R);
  // the other one sometimes answers too (a third of the time, or if named)
  const O = RES.find(o => o !== R); if (O && (new RegExp(O.name, 'i').test(t) || Math.random() < 0.33)) await talk({ event: 'overheard' }, O);
});
document.getElementById('leave').onclick = async () => { if (RES.some(R => R.mind.busy)) return; say('sys', 'you leave'); for (const R of RES) { await talk({ event: 'leave' }, R); R.mind.sessionId = null; R.mind.history = []; } document.getElementById('leave').textContent = 'Left · reload to come back'; document.getElementById('form').style.display = 'none'; };
document.getElementById('memtoggle').onclick = e => { memEl.style.display = memEl.style.display === 'block' ? 'none' : 'block'; e.target.classList.toggle('on'); };
window.__world = { marco, reflex, mind, player, talk, SPOTS, SEATS, props, RES };
const _f = new THREE.Vector3();

// ---------- loop ----------
let last = performance.now(); status.textContent = 'you arrive';
r.setAnimationLoop(now => {
  const dt = Math.min((now - last) / 1000, 0.05); last = now;
  movePlayer(dt); placeCam();
  const eye = new THREE.Vector3(player.pos.x, EYE - 0.05, player.pos.z);
  // he keeps an eye on you when you're close, otherwise on what he's doing
  for (const R of RES) {
    const rf = R.reflex;
    if (!rf.busy && rf.posture !== 'lie') { const other = RES.find(o => o !== R); rf.lookAt(player.pos.distanceTo(R.model.position) < 3.2 ? eye : other ? other.head.getWorldPosition(new THREE.Vector3()) : null); }
    rf.update(dt, { player: eye, spots: SPOTS });
    R.anat.update(dt);
    if (R.bassOn && bass) { _f.set(Math.sin(R.model.rotation.y), 0, Math.cos(R.model.rotation.y)); bass.position.copy(R.model.position).addScaledVector(_f, 0.3); bass.position.y = 0.5; bass.rotation.set(0, R.model.rotation.y + Math.PI / 2, 1.15); }
  }
  placeBubble();
  r.render(scene, cam);
});
if (!new URLSearchParams(location.search).has('quiet')) await talk({ event: 'arrive' });   // ?quiet=1: look around without waking him
</script>
